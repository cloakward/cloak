name: homebrew-bump

# Bumps the Homebrew formula in cloakward/homebrew-cloak after release
# install verification. The cred-blocker (HOMEBREW_TAP_TOKEN secret + tap
# repo creation) is tracked at:
#   https://github.com/cloakward/cloak/issues/5
# If the secret is absent, prereleases skip with a warning but stable
# releases fail so a production publish cannot silently omit Homebrew.

on:
  # Manual dispatch only. Must be run from the release tag ref
  # (`gh workflow run homebrew-bump.yml --ref "$TAG" -f ref="$TAG"`) and
  # requires a successful release-install marker for the same stable tag.
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to bump (e.g. v0.9.0-rc2)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  bump:
    name: Bump cloakward/homebrew-cloak
    runs-on: ubuntu-24.04
    steps:
      - name: Check tap credential
        id: cred
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.ref }}
        run: |
          set -euo pipefail
          case "${TAG#v}" in
            *-*) is_prerelease=true ;;
            *) is_prerelease=false ;;
          esac
          if [ "$is_prerelease" = "true" ]; then
            echo "::notice title=homebrew-bump skipped::Stable Homebrew formula bumps are skipped for prerelease tag ${TAG}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::error title=homebrew-bump blocked::HOMEBREW_TAP_TOKEN not set; stable releases must publish a Homebrew bump PR or fail visibly."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Parse release tag
        if: steps.cred.outputs.skip == 'false'
        id: tag
        env:
          # Honor either the release event or the manual dispatch input.
          TAG: ${{ github.event.release.tag_name || inputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::no tag resolved (release.tag_name and inputs.ref both empty)"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Homebrew stable formula bumps require a stable SemVer tag like v1.2.3"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/${TAG}" ]; then
            echo "::error::homebrew-bump must run from the same tag ref. Use: gh workflow run homebrew-bump.yml --ref ${TAG} -f ref=${TAG}"
            exit 1
          fi
          # Strip leading "v" if present.
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout source tag
        if: steps.cred.outputs.skip == 'false'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Require release-install marker
        if: steps.cred.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/require-release-install-marker.sh "$TAG"

      - name: Install cosign
        if: steps.cred.outputs.skip == 'false'
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
        with:
          cosign-release: "v2.4.1"

      - name: Resolve release asset URLs and SHA256s
        if: steps.cred.outputs.skip == 'false'
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          REPO: ${{ github.repository }}
          COSIGN_EXPERIMENTAL: "1"
          # Workflow ref must match release.yml on the tagged commit.
          EXPECTED_ISSUER: "https://token.actions.githubusercontent.com"
          EXPECTED_IDENTITY: "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ steps.tag.outputs.tag }}"
        run: |
          set -euo pipefail

          # Expected asset filenames produced by the release workflow.
          # Pattern: cloak-<version>-<target-triple>.tar.gz (version without the leading "v").
          MAC_ARM64="cloak-${VERSION}-aarch64-apple-darwin.tar.gz"
          MAC_X86_64="cloak-${VERSION}-x86_64-apple-darwin.tar.gz"
          LINUX_X86_64="cloak-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"

          # Fetch release JSON.
          RELEASE_JSON="$(gh api "repos/${REPO}/releases/tags/${TAG}")"

          resolve_url() {
            local name="$1"
            jq -r --arg n "$name" '.assets[] | select(.name == $n) | .browser_download_url' <<<"$RELEASE_JSON"
          }

          MAC_ARM64_URL="$(resolve_url "$MAC_ARM64")"
          MAC_X86_64_URL="$(resolve_url "$MAC_X86_64")"
          LINUX_X86_64_URL="$(resolve_url "$LINUX_X86_64")"

          for pair in \
              "macOS arm64:$MAC_ARM64_URL" \
              "macOS x86_64:$MAC_X86_64_URL" \
              "linux x86_64:$LINUX_X86_64_URL"; do
            label="${pair%%:*}"
            url="${pair#*:}"
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "::error::Missing release asset for ${label} (expected one of ${MAC_ARM64} / ${MAC_X86_64} / ${LINUX_X86_64})"
              exit 1
            fi
          done

          mkdir -p dl

          # Download the tarball + its cosign signature/cert and verify the
          # signature against the release.yml workflow identity BEFORE we
          # compute the sha that gets baked into the Homebrew formula. This
          # gives Homebrew users supply-chain parity with `gh release
          # download` users (who would otherwise be the only ones to detect
          # tampering via cosign verify-blob).
          verify_blob() {
            local url="$1"
            local out
            out="dl/$(basename "$url")"
            curl -sSfL "$url"        -o "${out}"
            curl -sSfL "${url}.sig"  -o "${out}.sig"
            curl -sSfL "${url}.cert" -o "${out}.cert"
            if ! cosign verify-blob \
                --certificate "${out}.cert" \
                --signature "${out}.sig" \
                --certificate-oidc-issuer "$EXPECTED_ISSUER" \
                --certificate-identity "$EXPECTED_IDENTITY" \
                "${out}" >&2; then
              echo "::error::cosign verify-blob FAILED for $(basename "$url"); refusing to bump Homebrew formula."
              exit 1
            fi
          }

          sha_of() {
            local url="$1"
            local out
            out="dl/$(basename "$url")"
            verify_blob "$url"
            sha256sum "$out" | awk '{print $1}'
          }

          MAC_ARM64_SHA="$(sha_of "$MAC_ARM64_URL")"
          MAC_X86_64_SHA="$(sha_of "$MAC_X86_64_URL")"
          LINUX_X86_64_SHA="$(sha_of "$LINUX_X86_64_URL")"

          {
            echo "mac_arm64_url=${MAC_ARM64_URL}"
            echo "mac_arm64_sha=${MAC_ARM64_SHA}"
            echo "mac_x86_64_url=${MAC_X86_64_URL}"
            echo "mac_x86_64_sha=${MAC_X86_64_SHA}"
            echo "linux_x86_64_url=${LINUX_X86_64_URL}"
            echo "linux_x86_64_sha=${LINUX_X86_64_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Render Formula/cloak.rb
        if: steps.cred.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          MAC_ARM64_URL: ${{ steps.assets.outputs.mac_arm64_url }}
          MAC_ARM64_SHA: ${{ steps.assets.outputs.mac_arm64_sha }}
          MAC_X86_64_URL: ${{ steps.assets.outputs.mac_x86_64_url }}
          MAC_X86_64_SHA: ${{ steps.assets.outputs.mac_x86_64_sha }}
          LINUX_X86_64_URL: ${{ steps.assets.outputs.linux_x86_64_url }}
          LINUX_X86_64_SHA: ${{ steps.assets.outputs.linux_x86_64_sha }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cat > tap/Formula/cloak.rb <<EOF
          class Cloak < Formula
            desc "MCP-native local secrets vault"
            homepage "https://github.com/cloakward/cloak"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "${MAC_ARM64_URL}"
                sha256 "${MAC_ARM64_SHA}"
              end
              on_intel do
                url "${MAC_X86_64_URL}"
                sha256 "${MAC_X86_64_SHA}"
              end
            end

            on_linux do
              on_intel do
                url "${LINUX_X86_64_URL}"
                sha256 "${LINUX_X86_64_SHA}"
              end
            end

            depends_on "libsodium"

            def install
              bin.install "bin/cloak"
              bin.install "bin/cloakd"
              bin.install "bin/cloak-mcp"
              pkgshare.install "share/polkit-1/actions/dev.cloak.policy" if File.exist?("share/polkit-1/actions/dev.cloak.policy")
            end

            def caveats
              if OS.linux?
                <<~EOS
                  Install Cloak's polkit action before using biometric/user-presence gated reveal:
                    sudo install -Dm644 "#{pkgshare}/dev.cloak.policy" /usr/share/polkit-1/actions/dev.cloak.policy
                EOS
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/cloak --version")
            end
          end
          EOF

      - name: Checkout cloakward/homebrew-cloak
        if: steps.cred.outputs.skip == 'false'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: cloakward/homebrew-cloak
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-cloak

      - name: Commit formula, open PR, and request merge
        if: steps.cred.outputs.skip == 'false'
        id: tap_pr
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: homebrew-cloak
        run: |
          set -euo pipefail

          git config user.name "cloak-release-bot"
          git config user.email "release-bot@users.noreply.github.com"

          BRANCH="bump/cloak-${VERSION}"

          # Always branch from the freshest origin/main. If a previous
          # release's bump PR was merged into main between the moment
          # this workflow started and the moment it pushes, branching
          # from the local checkout's HEAD (which actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
          # fetched at job start, depth=1) leaves the new branch on a
          # stale main and the resulting PR conflicts as add/add when
          # the older formula is already on main. Re-fetch + branch
          # from the current tip every time.
          git fetch origin main --depth=1
          git checkout -B "$BRANCH" origin/main

          # Re-copy the rendered formula AFTER the checkout so the
          # working tree reflects the version we want to land.
          mkdir -p Formula
          cp ../tap/Formula/cloak.rb Formula/cloak.rb

          # Stage first, then diff against HEAD. `git diff --quiet`
          # alone misses brand-new (untracked) files — that's what
          # tripped this on the very first formula bump for an empty
          # tap repo. With the file staged, `git diff --cached` sees
          # the add as a change and we proceed to push + PR.
          git add Formula/cloak.rb
          if git diff --cached --quiet -- Formula/cloak.rb; then
            echo "::notice::Formula/cloak.rb already up to date for ${VERSION}; nothing to do."
            exit 0
          fi

          git commit -m "cloak ${VERSION}"
          head_sha="$(git rev-parse HEAD)"
          # `--force-with-lease` is safe here: the branch is bot-owned
          # and is recreated from origin/main on every run, so any
          # remote state for `bump/cloak-${VERSION}` is by definition
          # stale and should be replaced.
          git push --set-upstream origin "$BRANCH" --force-with-lease

          if pr_json="$(gh pr view "$BRANCH" --repo cloakward/homebrew-cloak --json number,url 2>/dev/null)"; then
            pr_number="$(jq -r '.number' <<<"$pr_json")"
            pr_url="$(jq -r '.url' <<<"$pr_json")"
            echo "Reusing existing Homebrew bump PR: ${pr_url}"
          else
            pr_url="$(gh pr create \
              --repo cloakward/homebrew-cloak \
              --base main \
              --head "$BRANCH" \
              --title "cloak ${VERSION}" \
              --body "Automated formula bump for [cloak ${TAG}](https://github.com/${{ github.repository }}/releases/tag/${TAG}).")"
            pr_number="${pr_url##*/}"
            echo "Created Homebrew bump PR: ${pr_url}"
          fi

          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"

          if gh pr merge "$pr_number" \
              --repo cloakward/homebrew-cloak \
              --squash \
              --delete-branch \
              --subject "cloak ${VERSION}" \
              --match-head-commit "$head_sha"; then
            echo "Homebrew bump PR merge request accepted for ${pr_url}."
          else
            echo "::warning::Immediate Homebrew PR merge failed; attempting to enable auto-merge for ${pr_url}."
            if gh pr merge "$pr_number" \
                --repo cloakward/homebrew-cloak \
                --auto \
                --squash \
                --delete-branch \
                --subject "cloak ${VERSION}" \
                --match-head-commit "$head_sha"; then
              echo "Enabled auto-merge for Homebrew bump PR ${pr_url}."
            else
              echo "::error::Unable to merge or enable auto-merge for Homebrew bump PR ${pr_url}; stable publish must fail until tap main serves cloak ${VERSION}."
              exit 1
            fi
          fi

      - name: Verify Homebrew tap main serves release
        if: steps.cred.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          tmp_formula="$(mktemp)"
          for attempt in $(seq 1 30); do
            gh api "repos/cloakward/homebrew-cloak/contents/Formula/cloak.rb?ref=main" --jq .content | base64 -d > "$tmp_formula"
            if diff -u tap/Formula/cloak.rb "$tmp_formula"; then
              echo "Homebrew tap main serves cloak ${VERSION}."
              exit 0
            fi
            echo "Homebrew tap main does not serve the rendered ${VERSION} formula yet (attempt ${attempt}/30); retrying..."
            sleep 10
          done

          echo "::error::Homebrew tap main still does not serve the rendered cloak ${VERSION} formula; stable publish must not treat Homebrew as live."
          exit 1
