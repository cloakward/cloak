# W9b - release pipeline: cosign keyless signing + SLSA L3 provenance.
#
# Triggers ONLY on `v*` tag pushes (e.g. v0.9.0-rc1, v1.0.0). Builds release
# tarballs of `cloak`, `cloakd`, and `cloak-mcp` for the v1.0 platforms,
# builds Claude Desktop .dxt packages for macOS, signs every
# tarball, every .dxt, and the checksum file with cosign keyless via the
# Actions OIDC token after the release-time CI/security/smoke gates pass,
# generates SLSA L3 provenance, and drafts a GitHub Release. The draft
# upload step verifies the exact uploaded asset inventory and bytes; a
# separate verification job re-runs cosign verify-blob and slsa-verifier.
# The draft is promoted by publish-release.yml after release-install.yml
# creates an asset-bound install-test marker.
#
# Major action versions are still moving inputs; see docs/RELEASE.md before
# cutting a production tag. Both macOS architectures are required because the
# tarballs, DXT packages, Homebrew formula, and install verification advertise
# both.
#
# Out of scope for this workstream:
#   - npm publish
#   - Docker push
#   - Homebrew tap bump
#   - SignPath / Windows code signing

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BUN_VERSION: "1.2.9"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------
  # 0. Release tag trust gate.
  #
  # A release tag must point at a commit already reachable from beta or
  # main. This prevents a pushed tag on an arbitrary commit from
  # bypassing branch-protected CI history and producing signed assets.
  # Tags must also be annotated so the release note source is an
  # intentional tag object, not an accidental lightweight ref.
  # -------------------------------------------------------------------
  tag-guard:
    name: release tag guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Require trusted annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" = "$GITHUB_REF" ]; then
            echo "::error::release workflow must run from a tag ref"
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::release tag must be SemVer like v1.2.3 or v1.2.3-rc1"
            exit 1
          fi
          if ! git rev-parse -q --verify "${tag}^{tag}" >/dev/null; then
            echo "::error::release tag ${tag} must be annotated; lightweight tags are not accepted"
            exit 1
          fi
          tag_object="$(git rev-parse "${tag}^{tag}")"
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          tag_verified="$(jq -r '.verification.verified // false' <<<"$tag_json")"
          if [ "$tag_verified" != "true" ]; then
            reason="$(jq -r '.verification.reason // "unknown"' <<<"$tag_json")"
            echo "::error::release tag ${tag} must have a verified signature (reason: ${reason})"
            exit 1
          fi

          commit="$(git rev-list -n 1 "$tag")"
          if [ -z "$commit" ]; then
            echo "::error::could not resolve commit for ${tag}"
            exit 1
          fi

          git fetch --force origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/beta:refs/remotes/origin/beta
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "tag commit is reachable from origin/main"
          elif git merge-base --is-ancestor "$commit" origin/beta; then
            echo "tag commit is reachable from origin/beta"
          else
            echo "::error::release tag ${tag} points at ${commit}, which is not reachable from origin/main or origin/beta"
            exit 1
          fi

  # -------------------------------------------------------------------
  # 1. Build release tarballs per platform.
  # -------------------------------------------------------------------
  build:
    name: build (${{ matrix.os }}, ${{ matrix.target }})
    needs: tag-guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.best_effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            platform: macos
            cross: false
            best_effort: false
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos
            cross: false
            best_effort: false
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            cross: false
            best_effort: false
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux
            cross: true
            best_effort: false
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            platform: linux
            cross: true
            best_effort: false

    env:
      # Pin the macOS deployment floor on the macos-26 (Tahoe) runners so
      # the produced arm64/x86_64 tarballs still load on macOS 13+.
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Resolve release version from tag
        id: meta
        shell: bash
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          version="${ref#v}"
          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version}"
          echo "Prerelease: ${prerelease}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@aad518f59d88bae90133242f9ddac7f8bbc5dddf
        with:
          targets: ${{ matrix.target }}

      - name: Prepare pinned libsodium source
        shell: bash
        run: ./scripts/prepare-libsodium-dist.sh

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify package versions match release tag
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.meta.outputs.version }}"
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cloak-cli") | .version' | head -n1)"
          mcp_version="$(bun -e "const p = require('./packages/cloak-mcp/package.json'); console.log(p.version)")"
          if [ "$cargo_version" != "$expected" ]; then
            echo "::error::Cargo package version ${cargo_version} does not match release tag version ${expected}"
            exit 1
          fi
          if [ "$mcp_version" != "$expected" ]; then
            echo "::error::packages/cloak-mcp/package.json version ${mcp_version} does not match release tag version ${expected}"
            exit 1
          fi

      - name: Install cross (musl row)
        if: matrix.cross
        uses: taiki-e/install-action@15413b256f995d819248ea62704771a959284285
        with:
          tool: cross

      - name: Cargo cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: release-${{ matrix.target }}

      - name: cargo build (host targets)
        if: ${{ !matrix.cross }}
        env:
          SODIUM_DIST_DIR: ${{ github.workspace }}/.cargo/libsodium-dist
        run: cargo build --locked --release --workspace --target ${{ matrix.target }}

      - name: cross build (musl)
        if: matrix.cross
        env:
          SODIUM_DIST_DIR: /project/.cargo/libsodium-dist
        run: cross build --locked --release --workspace --target ${{ matrix.target }}

      - name: cloak-mcp single-binary build
        # `bun build --compile` embeds the runner host's bun runtime (glibc-linked,
        # host arch). Skip on:
        #   * x86_64-unknown-linux-musl - bun runtime is glibc-linked, won't run on
        #     a pure-musl userspace.
        #   * aarch64-unknown-linux-gnu - runs on x86_64 host; bun --compile cannot
        #     cross-target arm64.
        # These two tarballs ship cloak + cloakd only.
        if: ${{ matrix.target != 'x86_64-unknown-linux-musl' && matrix.target != 'aarch64-unknown-linux-gnu' }}
        working-directory: packages/cloak-mcp
        run: |
          bun install --frozen-lockfile
          bun build src/server.ts --compile --outfile dist/cloak-mcp
          chmod 755 dist/cloak-mcp
          ./dist/cloak-mcp --version | grep -F "cloak-mcp ${{ steps.meta.outputs.version }}"

      # ---------------------------------------------------------------
      # Apple code-signing + notarization (macOS rows only).
      #
      # Order: codesign --options runtime → zip → notarytool submit
      # --wait → unzip → stapler staple → tarball. Cosign keyless
      # signing happens later (in the `sign` job) over the FINAL
      # notarized tarball, so the cosign cert covers the signed/notarized
      # bytes the user actually downloads. Bare Mach-O binaries cannot
      # always be stapled in-place; the notarization ticket may be fetched
      # online by Gatekeeper on first launch.
      #
      # Stable production tags are not allowed to ship unsigned macOS
      # artifacts. Prerelease tags may skip signing/notarization for
      # fork/preflight previews, but the tarballs are then explicitly
      # unsigned.
      # ---------------------------------------------------------------
      - name: Apple signing/notarization secret gate
        id: apple_secrets
        if: matrix.platform == 'macos'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERT_P12_BASE64 \
            APPLE_CERT_PASSWORD \
            APPLE_API_KEY_ID \
            APPLE_API_KEY_ISSUER_ID \
            APPLE_API_KEY_BASE64 \
            APPLE_TEAM_ID \
          ; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing/notarization secrets are configured."
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          printf -v joined '%s, ' "${missing[@]}"
          joined="${joined%, }"

          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            echo "::warning::Missing Apple signing/notarization secrets (${joined}); prerelease macOS tarball will be unsigned and unnotarized."
            exit 0
          fi

          echo "::error::Missing Apple signing/notarization secrets for production tag: ${joined}"
          echo "::error::Stable macOS releases must be Developer ID signed and submitted to Apple notarytool."
          exit 1

      - name: Apple codesign - import Developer ID cert into temp keychain
        id: apple_codesign
        if: ${{ matrix.platform == 'macos' && steps.apple_secrets.outputs.available == 'true' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"

          # Throwaway keychain with a random unlock password - we delete
          # it after the build via a cleanup step. The keychain holds
          # only the Developer ID Application certificate for the
          # duration of this job.
          KEYCHAIN_PATH="${RUNNER_TEMP}/cloak-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="${RUNNER_TEMP}/cloak-cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Allow codesign to use the imported key non-interactively.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Prepend the temp keychain to the search list so codesign
          # can find the identity without disturbing the login keychain.
          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"

          # Resolve the signing identity. We expect exactly one
          # "Developer ID Application: <NAME> (<TEAM_ID>)" identity
          # in the temp keychain.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in imported keychain."
            exit 1
          fi
          if [[ "$IDENTITY" != *"(${APPLE_TEAM_ID})"* ]]; then
            echo "::error::Developer ID identity '${IDENTITY}' does not match APPLE_TEAM_ID '${APPLE_TEAM_ID}'."
            exit 1
          fi
          echo "Signing identity: ${IDENTITY}"

          # Sign each binary with hardened-runtime + secure timestamp.
          # `--options runtime` is required for notarization. The Bun-compiled
          # MCP shim alone needs the JavaScriptCore JIT entitlement; keep that
          # entitlement off cloak/cloakd because they do not execute JS.
          for bin in \
            "target/${target}/release/cloak" \
            "target/${target}/release/cloakd" \
          ; do
            if [ -f "$bin" ]; then
              echo "codesigning ${bin}..."
              codesign --force --options runtime --timestamp \
                --sign "$IDENTITY" "$bin"
              codesign --verify --strict --verbose=2 "$bin"
            fi
          done

          mcp_bin="packages/cloak-mcp/dist/cloak-mcp"
          if [ -f "$mcp_bin" ]; then
            echo "codesigning ${mcp_bin} with Bun JIT entitlement..."
            codesign --force --options runtime --timestamp \
              --entitlements packaging/macos/cloak-mcp.entitlements.plist \
              --sign "$IDENTITY" "$mcp_bin"
            codesign --verify --strict --verbose=2 "$mcp_bin"
            codesign -d --entitlements :- "$mcp_bin"
          fi

          # Persist for downstream steps (notarize, cleanup).
          echo "keychain_path=${KEYCHAIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Apple codesign - skip notice
        if: ${{ matrix.platform == 'macos' && steps.apple_secrets.outputs.available != 'true' }}
        shell: bash
        run: |
          echo "::warning::Apple signing/notarization skipped for prerelease preview. Tarball will ship unsigned (Gatekeeper may require xattr -d com.apple.quarantine on download)."

      - name: Apple notarize - submit zip and staple binaries
        id: apple_notarize
        if: ${{ matrix.platform == 'macos' && steps.apple_codesign.outputs.signed == 'true' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"

          # Decode the App Store Connect API .p8 key to a tempfile.
          # notarytool reads the key via --key <path>.
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # notarytool only accepts ZIPs, DMGs, or signed packages.
          # We zip just the binaries (notarization scope is the
          # binaries themselves; the surrounding tar.gz is built
          # AFTER stapling).
          NOTARY_ZIP="${RUNNER_TEMP}/cloak-notarize.zip"
          rm -f "$NOTARY_ZIP"

          tmpdir="$(mktemp -d)"
          for bin in \
            "target/${target}/release/cloak" \
            "target/${target}/release/cloakd" \
            "packages/cloak-mcp/dist/cloak-mcp" \
          ; do
            if [ -f "$bin" ]; then cp "$bin" "$tmpdir/"; fi
          done
          ( cd "$tmpdir" && /usr/bin/zip -q -r "$NOTARY_ZIP" . )

          echo "Submitting ${NOTARY_ZIP} to Apple notarytool (this can take 1-15 minutes)..."
          xcrun notarytool submit "$NOTARY_ZIP" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER_ID" \
            --wait \
            --timeout 30m

          # Staple the notarization ticket to each binary in-place.
          # After stapling, the binaries carry an offline-verifiable
          # receipt - Gatekeeper accepts them without a network round-trip.
          for bin in \
            "target/${target}/release/cloak" \
            "target/${target}/release/cloakd" \
            "packages/cloak-mcp/dist/cloak-mcp" \
          ; do
            if [ -f "$bin" ]; then
              echo "stapling ${bin}..."
              # `stapler staple` only works on bundles/dmgs/pkgs, not
              # on bare Mach-O binaries - for command-line tools the
              # notarization ticket lives in Apple's CDN and Gatekeeper
              # fetches it on first launch (online check). For an
              # offline-stapled experience we'd ship a .pkg or .dmg;
              # for now we verify notarization succeeded and rely on
              # the network ticket lookup (same model as Homebrew bottles).
              xcrun stapler staple "$bin" 2>&1 || \
                echo "::notice::stapler does not support bare Mach-O ${bin}; binary is notarized and Gatekeeper will fetch the ticket online on first launch."
            fi
          done

          rm -f "$KEY_PATH" "$NOTARY_ZIP"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Apple notarize - cleanup temp keychain
        if: ${{ always() && matrix.platform == 'macos' && steps.apple_codesign.outputs.keychain_path != '' }}
        shell: bash
        run: |
          security delete-keychain "${{ steps.apple_codesign.outputs.keychain_path }}" || true

      - name: Apple notarize - production assertion
        if: ${{ matrix.platform == 'macos' && steps.meta.outputs.prerelease != 'true' && steps.apple_notarize.outputs.notarized != 'true' }}
        shell: bash
        run: |
          echo "::error::Production macOS artifacts must be signed and notarized before packaging."
          exit 1

      - name: Stage and tarball release artifacts
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          target="${{ matrix.target }}"
          stage="cloak-${version}-${target}"
          mkdir -p "dist/${stage}/bin"

          cp "target/${target}/release/cloak"  "dist/${stage}/bin/"
          cp "target/${target}/release/cloakd" "dist/${stage}/bin/"
          # cloak-mcp ships only on platforms where the bun --compile build ran.
          if [ -f "packages/cloak-mcp/dist/cloak-mcp" ]; then
            cp "packages/cloak-mcp/dist/cloak-mcp" "dist/${stage}/bin/"
          fi
          if [ "${{ matrix.platform }}" = "linux" ]; then
            mkdir -p "dist/${stage}/share/polkit-1/actions"
            cp "scripts/polkit/dev.cloak.policy" \
              "dist/${stage}/share/polkit-1/actions/dev.cloak.policy"
          fi
          # Self-describing tarball: include README + license + changelog
          # if present at top level. Missing files are non-fatal so the
          # workflow doesn't break when these are renamed.
          for f in README.md LICENSE LICENSE-APACHE LICENSE-MIT SECURITY.md CHANGELOG.md; do
            if [ -f "$f" ]; then cp "$f" "dist/${stage}/"; fi
          done

          tarball="${stage}.tar.gz"
          tar -C dist -czf "dist/${tarball}" "${stage}"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "stage=${stage}" >> "$GITHUB_OUTPUT"

          # Per-tarball sha256 fragment, used by the aggregate sums step.
          # macOS prefers `shasum -a 256`; Linux has both.
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum "${tarball}" ) > "dist/${tarball}.sha256"
          else
            ( cd dist && shasum -a 256 "${tarball}" ) > "dist/${tarball}.sha256"
          fi
          cat "dist/${tarball}.sha256"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tarball-${{ matrix.target }}
          path: |
            dist/${{ steps.pack.outputs.tarball }}
            dist/${{ steps.pack.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # 2. macOS coverage guard.
  #
  # Both macOS release tarballs are required because install tests, DXT
  # packaging, and the Homebrew formula advertise both architectures.
  # -------------------------------------------------------------------
  macos-guard:
    name: macos coverage guard
    needs: build
    runs-on: ubuntu-24.04
    if: always() && needs.build.result != 'cancelled'
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: incoming
          pattern: tarball-*-apple-darwin

      - name: Verify at least one macOS row produced a tarball
        shell: bash
        run: |
          set -euo pipefail
          arm="incoming/tarball-aarch64-apple-darwin"
          x86="incoming/tarball-x86_64-apple-darwin"
          arm_present=0
          x86_present=0
          [ -d "$arm" ] && arm_present=1
          [ -d "$x86" ] && x86_present=1

          if [ "$arm_present" -eq 0 ]; then
            echo "::error::macos-26 (aarch64-apple-darwin) tarball absent."
            exit 1
          fi
          if [ "$x86_present" -eq 0 ]; then
            echo "::error::macos-26-intel (x86_64-apple-darwin) tarball absent."
            exit 1
          fi

  # -------------------------------------------------------------------
  # 3. Release-time CI/security/smoke gates.
  #
  # These reuse the same workflows that protect beta/main, but run from
  # the release tag's exact commit. The sign job below depends on them,
  # so no artifact is cosign-signed until CI, security, and smoke pass
  # for the bytes being released.
  # -------------------------------------------------------------------
  ci-gate:
    name: release gate / ci
    needs: tag-guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security-gate:
    name: release gate / security
    needs: tag-guard
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  smoke-gate:
    name: release gate / smoke
    needs: tag-guard
    uses: ./.github/workflows/smoke.yml
    permissions:
      contents: read

  # -------------------------------------------------------------------
  # 4. Aggregate sha256sums + cosign keyless sign every artifact.
  # This waits for dxt-package as well as tarball builds so Claude
  # Desktop extension assets are covered by the same signatures and SLSA
  # provenance as the core tarballs.
  # -------------------------------------------------------------------
  sign:
    name: sign release artifacts (cosign keyless)
    needs: [build, macos-guard, dxt-package, ci-gate, security-gate, smoke-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write   # OIDC token for cosign keyless
      contents: read
    outputs:
      version: ${{ needs.build.outputs.version }}
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Download all tarball artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: incoming
          pattern: tarball-*

      - name: Download .dxt artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dxt-incoming
          pattern: dxt-*
          merge-multiple: true

      - name: Flatten artifacts into ./dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Each tarball-<target>/ holds one .tar.gz and one .tar.gz.sha256.
          find incoming -type f \( -name "*.tar.gz" -o -name "*.tar.gz.sha256" \) -exec cp {} dist/ \;
          find dxt-incoming -type f -name "*.dxt" -exec cp {} dist/ \;
          find dist -maxdepth 1 -type f -print

      - name: Verify required DXT inventory
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          for name in \
            "Cloak-${version}-macos-arm64.dxt" \
            "Cloak-${version}-macos-x64.dxt"
          do
            test -f "dist/${name}" || {
              echo "::error::missing required DXT package ${name}"
              exit 1
            }
          done

      - name: Compute aggregate sha256sums.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          : > sha256sums.txt
          # Stable ordering for reproducibility. Do not include
          # sha256sums.txt in itself; SLSA covers the final checksum file
          # separately in the next step.
          while IFS= read -r f; do
            sha256sum "$f" >> sha256sums.txt
          done < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.dxt' \) -printf '%f\n' | sort)
          cat sha256sums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
        with:
          cosign-release: "v2.4.1"

      - name: cosign sign-blob (each tarball, .dxt, and sha256sums.txt)
        env:
          COSIGN_EXPERIMENTAL: "1"
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          while IFS= read -r f; do
            echo "Signing ${f}..."
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.cert" \
              "${f}"
          done < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.dxt' -o -name 'sha256sums.txt' \) -printf '%f\n' | sort)
          find . -maxdepth 1 -type f \( -name '*.sig' -o -name '*.cert' \) -print

      - name: Compute base64 hashes for SLSA generator
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # The SLSA generic generator wants base64 of a sha256sums-style
          # listing of every artifact we want covered by provenance -
          # that's every tarball, every .dxt, plus the sums file itself.
          tmp="$(mktemp)"
          while IFS= read -r f; do
            sha256sum "$f" >> "$tmp"
          done < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.dxt' -o -name 'sha256sums.txt' \) -printf '%f\n' | sort)
          encoded="$(base64 -w0 < "$tmp")"
          echo "hashes=${encoded}" >> "$GITHUB_OUTPUT"

      - name: Upload signed bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-bundle
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sig
            dist/*.tar.gz.cert
            dist/*.dxt
            dist/*.dxt.sig
            dist/*.dxt.cert
            dist/sha256sums.txt
            dist/sha256sums.txt.sig
            dist/sha256sums.txt.cert
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # 2b. Cloak.dxt - Claude Desktop Extension package.
  #
  # Builds one .dxt per Claude Desktop platform we currently ship
  # (macOS arm64/x64) by
  # reusing the cloak-mcp binary from the same tarball the build job
  # produced. No second build of cloak-mcp - the bytes inside the .dxt
  # are byte-identical to those inside the signed tarball. Windows
  # packaging is deferred until Windows support ships.
  #
  # The sign job waits for these artifacts, then signs and provenance-
  # attests them with the rest of the release payload.
  # -------------------------------------------------------------------
  dxt-package:
    name: dxt package (${{ matrix.platform_tag }})
    needs: [build, macos-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Claude Desktop currently installs local MCPB/DXT extensions on
        # macOS and Windows. Windows is not a shipped Cloak target yet, so
        # DXT release assets are macOS-only for now. Linux tarballs still
        # include cloak-mcp where Bun can build it, but not a Claude Desktop
        # extension package.
        include:
          - target: aarch64-apple-darwin
            platform_tag: macos-arm64
          - target: x86_64-apple-darwin
            platform_tag: macos-x64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download tarball for ${{ matrix.target }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        id: dl
        with:
          name: tarball-${{ matrix.target }}
          path: incoming

      - name: Extract cloak-mcp from tarball
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          stage="cloak-${version}-${{ matrix.target }}"
          tarball="incoming/${stage}.tar.gz"
          test -f "$tarball" || { echo "::error::expected $tarball"; exit 1; }
          mkdir -p extracted
          tar -C extracted -xzf "$tarball"
          # PR #40 changed the tarball layout to nest binaries under `bin/`.
          mcp="extracted/${stage}/bin/cloak-mcp"
          test -f "$mcp" || { echo "::error::cloak-mcp not at $mcp inside tarball"; exit 1; }
          chmod +x "$mcp"
          platform_tag="${{ matrix.platform_tag }}"
          if [[ "$platform_tag" = linux-* ]]; then
            version_output="$("$mcp" --version)"
          else
            version_output="cloak-mcp ${version}"
          fi
          if [ "$version_output" != "cloak-mcp ${version}" ]; then
            echo "::error::cloak-mcp binary version does not match ${version}: ${version_output}"
            exit 1
          fi
          echo "mcp=$mcp" >> "$GITHUB_OUTPUT"
          echo "version_output=$version_output" >> "$GITHUB_OUTPUT"

      - name: Build .dxt
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          ./scripts/build-dxt.sh "$version" "${{ matrix.platform_tag }}" "${{ steps.extract.outputs.mcp }}" "${{ steps.extract.outputs.version_output }}"

      - name: Upload .dxt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dxt-${{ matrix.platform_tag }}
          path: dist/Cloak-*.dxt
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # 5. SLSA L3 provenance via the official reusable workflow.
  # MUST be referenced by the `v2.0.0` semver tag, NOT a commit SHA: the
  # slsa-github-generator derives its builder version from the tag ref and
  # self-verifies it; referencing by digest makes the generator's `final`
  # job fail. This is the documented, supported usage and the one action we
  # deliberately do not pin by SHA (the tag commit is 5a775b3…). The
  # generator expects the base64-encoded sha256-list output from the sign job.
  # -------------------------------------------------------------------
  provenance:
    name: slsa provenance (L3)
    needs: sign
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.sign.outputs.hashes }}
      provenance-name: multiple.intoto.jsonl
      upload-assets: false

  # -------------------------------------------------------------------
  # 6. Draft GitHub Release.
  #
  # Attaches every tarball, every .dxt, every .sig, every .cert,
  # sha256sums.txt (+ its sig/cert), and the SLSA provenance jsonl. Notes are pulled
  # from the tag if `--notes-from-tag` finds anything; otherwise the
  # maintainer hand-edits before promotion. The release is created
  # in DRAFT state. The upload verification step and the verification
  # job below decide whether it is ready; publish-release.yml flips it to
  # published only after release-install.yml records a matching marker.
  # -------------------------------------------------------------------
  release:
    name: draft release
    needs: [sign, provenance, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.create.outputs.tag_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download signed bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-bundle
          path: dist

      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          # Hard-coded to match `provenance-name: multiple.intoto.jsonl`
          # passed to the SLSA reusable workflow's `with:` block above.
          # The reusable workflow's `outputs.provenance-name` has been a
          # historical footgun (intermittent empty values); pin literally.
          name: multiple.intoto.jsonl
          path: dist

      - name: List release payload
        shell: bash
        run: find dist -maxdepth 1 -type f -print

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"

          # Detect any SemVer pre-release segment so the draft is
          # marked `prerelease=true`. Downstream workflows
          # (docker-push, homebrew-bump) gate
          # production-only side-effects (e.g. the docker `:latest`
          # tag, formula bump) on this flag.
          prerelease_flag=""
          expected_prerelease="false"
          case "${tag#v}" in
            *-*)
              prerelease_flag="--prerelease"
              expected_prerelease="true"
              echo "Tag ${tag} matches pre-release pattern; will mark draft as prerelease."
              ;;
          esac

          # If a draft already exists (re-run), reuse it. If the release
          # has already been published, fail closed: never clobber public
          # assets for an already-published tag.
          if gh release view "$tag" --json databaseId,isDraft,isPrerelease > release.json 2>/dev/null; then
            is_draft="$(jq -r '.isDraft' release.json)"
            is_prerelease="$(jq -r '.isPrerelease' release.json)"
            if [ "$is_draft" != "true" ]; then
              echo "::error::release ${tag} already exists and is not a draft; refusing to clobber published assets"
              exit 1
            fi
            if [ "$is_prerelease" != "$expected_prerelease" ]; then
              echo "::error::existing draft prerelease flag (${is_prerelease}) does not match tag shape (${expected_prerelease})"
              exit 1
            fi
          else
            gh release create "$tag" \
              --draft \
              ${prerelease_flag} \
              --title "Cloak ${tag}" \
              --notes-from-tag \
              || gh release create "$tag" \
                --draft \
                ${prerelease_flag} \
                --title "Cloak ${tag}" \
                --generate-notes
          fi
          release_id="$(gh release view "$tag" --json databaseId --jq .databaseId)"
          if [ -z "$release_id" ]; then
            echo "::error::could not resolve draft release id for ${tag}"
            exit 1
          fi
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

          # Upload every artifact in dist/. `--clobber` so re-runs
          # against an existing draft don't duplicate-fail.
          find dist -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$tag" --clobber

      - name: Verify uploaded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > "$tmp/assets.json"
          find dist -maxdepth 1 -type f -exec basename {} \; | sort > "$tmp/local-names.txt"
          jq -r '.[].name' "$tmp/assets.json" | sort > "$tmp/remote-names.txt"

          if ! diff -u "$tmp/local-names.txt" "$tmp/remote-names.txt"; then
            echo "::error::draft release asset inventory does not exactly match signed dist/ payload"
            exit 1
          fi

          while IFS= read -r name; do
            local_path="dist/${name}"
            asset_json="$(jq -c --arg n "$name" '.[] | select(.name == $n)' "$tmp/assets.json")"
            asset_id="$(jq -r '.id' <<<"$asset_json")"
            remote_size="$(jq -r '.size' <<<"$asset_json")"
            local_size="$(wc -c < "$local_path" | tr -d '[:space:]')"

            if [ "$remote_size" != "$local_size" ]; then
              echo "::error::draft release asset size mismatch for ${name}: local=${local_size} remote=${remote_size}"
              exit 1
            fi

            remote_path="$tmp/${name}"
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$remote_path"

            local_sha="$(sha256sum "$local_path" | awk '{print $1}')"
            remote_sha="$(sha256sum "$remote_path" | awk '{print $1}')"
            if [ "$remote_sha" != "$local_sha" ]; then
              echo "::error::draft release asset sha256 mismatch for ${name}"
              echo "local:  ${local_sha}"
              echo "remote: ${remote_sha}"
              exit 1
            fi
            echo "verified uploaded asset ${name}"
          done < "$tmp/local-names.txt"

  # -------------------------------------------------------------------
  # 7. Verification gate.
  #
  # Fresh runner - verifies the same signed-bundle + SLSA provenance
  # artifacts that were attached to the draft release. We pull them
  # from the workflow's artifact storage rather than `gh release
  # download`, because gh cannot fetch from a release that is still
  # in DRAFT (the design intent is for the release to remain in DRAFT
  # until this verify gate passes). The bytes are identical to those
  # uploaded to the draft.
  # -------------------------------------------------------------------
  verify:
    name: verify signatures + provenance
    needs: [sign, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download signed bundle (from sign job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-bundle
          path: verify

      - name: Download SLSA provenance (from provenance job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          # Hard-coded to match `provenance-name: multiple.intoto.jsonl`
          # passed to the SLSA reusable workflow's `with:` block above.
          # The reusable workflow's `outputs.provenance-name` has been a
          # historical footgun (intermittent empty values); pin literally.
          name: multiple.intoto.jsonl
          path: verify

      - name: List verify payload
        shell: bash
        run: find verify -maxdepth 1 -type f -print

      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
        with:
          cosign-release: "v2.4.1"

      - name: cosign verify-blob (each tarball, .dxt, and sha256sums.txt)
        env:
          COSIGN_EXPERIMENTAL: "1"
          # Workflow ref must match release.yml on the tagged commit.
          EXPECTED_ISSUER: "https://token.actions.githubusercontent.com"
          EXPECTED_IDENTITY: "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            echo "Verifying ${f}..."
            if ! cosign verify-blob \
                --certificate "${f}.cert" \
                --signature "${f}.sig" \
                --certificate-oidc-issuer "$EXPECTED_ISSUER" \
                --certificate-identity "$EXPECTED_IDENTITY" \
                "$f"; then
              echo "::error::cosign verify-blob FAILED for ${f}"
              fail=1
            fi
          done < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.dxt' -o -name 'sha256sums.txt' \) -printf '%f\n' | sort)
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more cosign verifications failed. Release stays in DRAFT."
            exit 1
          fi

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@3714a2a4684014deb874a0e737dffa0ee02dd647

      - name: slsa-verifier verify-artifact
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          fail=0
          while IFS= read -r f; do
            echo "SLSA verifying ${f}..."
            if ! slsa-verifier verify-artifact \
                --provenance-path multiple.intoto.jsonl \
                --source-uri "github.com/${{ github.repository }}" \
                --source-tag "${{ github.ref_name }}" \
                "$f"; then
              echo "::error::slsa-verifier FAILED for ${f}"
              fail=1
            fi
          done < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.dxt' -o -name 'sha256sums.txt' \) -printf '%f\n' | sort)
          if [ "$fail" -ne 0 ]; then
            echo "::error::SLSA verification failed. Release stays in DRAFT."
            exit 1
          fi

      - name: Verification summary
        shell: bash
        run: |
          echo "All cosign + SLSA checks passed for ${{ github.ref_name }}."
          echo "The draft release job may now create and verify the GitHub Release payload."
