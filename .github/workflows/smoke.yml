# W3 — end-to-end smoke test on macOS arm64 and Linux glibc.
# Builds the workspace, drives the daemon + CLI + MCP shim through the
# init/add/list/show/daemon-unlock/mcp-self-test flow under a hermetic
# HOME, with CLOAK_PEPPER_FILE in lieu of an OS keychain.
name: smoke

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_call:

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos
          - os: ubuntu-24.04
            platform: linux

    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@aad518f59d88bae90133242f9ddac7f8bbc5dddf

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.9"

      - name: Cargo cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: smoke-${{ matrix.os }}

      - name: Run smoke test
        run: ./scripts/smoke-test.sh
