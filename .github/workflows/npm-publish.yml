# npm publishing is intentionally paused.
#
# The production daemon now pins MCP peers to native `cloak-mcp` binaries.
# The historical npm package launches the TypeScript server through `bun`,
# which means the daemon sees the peer as `bun` rather than as a trusted
# `cloak-mcp` binary. Publishing that package would create an install path
# that cannot authenticate to production `cloakd`.
#
# Keep this workflow as an explicit fail-closed control so old runbooks and
# saved GitHub UI links do not silently publish a broken package. Do not
# re-enable npm publishing until the package ships audited native binaries
# per supported platform and its installed dependency tree is locked.

name: npm-publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag that would have been published (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  disabled:
    name: npm publishing paused
    runs-on: ubuntu-24.04
    steps:
      - name: Validate tag and fail closed
        env:
          REF_NAME: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::ref must be a SemVer release tag like v1.2.3 or v1.2.3-rc1"
            exit 1
          fi
          echo "::error::npm publishing is paused: @cloak-ward/mcp does not ship a trusted native cloak-mcp binary package yet. Use Homebrew, release tarballs, or signed .dxt assets."
          exit 1
