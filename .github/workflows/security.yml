# W3 — supply-chain + license + advisory gate.
# Runs once per push/PR on Linux. Blocks merge.
name: security

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_call:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  osv-dependency-scan:
    name: osv dependency scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: osv dependency scan
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=packages/cloak-mcp/bun.lock

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@aad518f59d88bae90133242f9ddac7f8bbc5dddf

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.9"

      - name: Cargo cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: security

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87
        with:
          command: check
          arguments: --all-features

      # cargo-audit reads its own ignore list from `.cargo/audit.toml`.
      # We mirror the deny.toml justification there so both tools stay in
      # sync. See `.cargo/audit.toml` for the rationale.
      - name: Install cargo-audit
        uses: taiki-e/install-action@15413b256f995d819248ea62704771a959284285
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

      - name: cloak-mcp lint:no-http
        working-directory: packages/cloak-mcp
        run: |
          bun install --frozen-lockfile
          bun run lint:no-http

      # PLAN.md R2: cloak-core MUST NOT depend on aws-lc-rs. We pin rustls
      # to the `ring` provider so the daemon binary keeps a single crypto
      # stack (libsodium + ring TLS) instead of pulling in a second.
      - name: aws-lc-rs forbidden in cloak-core dep tree
        run: |
          if cargo tree --locked -p cloak-core 2>&1 | grep -q 'aws-lc-rs'; then
            echo "aws-lc-rs in cloak-core dep tree — forbidden, see PLAN.md R2"
            exit 1
          fi
          echo "ok: aws-lc-rs absent from cloak-core dep tree"
