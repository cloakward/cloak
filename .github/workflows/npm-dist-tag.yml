# One-shot dist-tag cleanup operations on @cloak-ward/mcp.
#
# npm requires 2FA-or-bypass-token for dist-tag changes regardless of
# whether the maintainer has 2FA configured locally. Running the
# operation here uses the repo's NPM_TOKEN secret (a granular access token
# with bypass-2FA enabled), so the maintainer does not need to wrangle tokens
# or OTP codes on their laptop. Adding/promoting dist-tags is paused while
# npm publishing is paused; removal remains available for cleanup.
#
# Trigger via GitHub UI (Actions → npm-dist-tag → Run workflow) or:
#   gh workflow run npm-dist-tag.yml --repo cloakward/cloak \
#     -f action=rm -f tag=latest
#
# `version` is currently ignored.

name: npm-dist-tag

on:
  workflow_dispatch:
    inputs:
      action:
        description: "rm"
        required: true
        type: choice
        options:
          - rm
      tag:
        description: "Dist-tag (e.g. beta, latest, next)"
        required: true
        type: string
      version:
        description: "Ignored while npm publishing is paused"
        required: false
        type: string

permissions:
  contents: read

jobs:
  dist-tag:
    name: ${{ inputs.action }} ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Run dist-tag op
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ACTION: ${{ inputs.action }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not configured on this repo."
            exit 1
          fi
          case "$ACTION" in
            rm)
              echo "==> npm dist-tag rm @cloak-ward/mcp ${TAG}"
              npm dist-tag rm "@cloak-ward/mcp" "${TAG}"
              ;;
            *)
              echo "::error::unknown action: ${ACTION}"
              exit 1
              ;;
          esac
          echo "---"
          echo "Current dist-tags for @cloak-ward/mcp:"
          npm dist-tag ls "@cloak-ward/mcp"
